name: Deploy ECS

on:
  push:
    branches:
      - candidato/rivaszamoramarky
    paths:
      - "app-ethos-mock/**"
      - ".github/workflows/ecs-deploy.yml"
      - "infra/iam/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-deploy-rivaszamoramarky
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "816583873447"
  AWS_REGION: us-east-1

  CANDIDATE_ID: rivaszamoramarky
  PROJECT_TAG: devops-test

  ECR_REPOSITORY: ethos-cand-rivaszamoramarky

  ECS_CLUSTER: ethos-cand-rivaszamoramarky-cluster
  ECS_SERVICE: ethos-cand-rivaszamoramarky-service
  ECS_CONTAINER_NAME: app-ethos-mock

  TASK_DEFINITION_FILE: app-ethos-mock/task-definition.json

  AWS_ROLE_ARN: arn:aws:iam::816583873447:role/ethos-cand-rivaszamoramarky-github-actions

  ALB_URL: http://ethos-cand-rivaszamoramarky-alb-515510390.us-east-1.elb.amazonaws.com

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        working-directory: app-ethos-mock
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building ${IMAGE_URI}"

          docker build \
            --tag "${IMAGE_URI}" \
            .

          docker push "${IMAGE_URI}"

          echo "image=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "image-tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Scan image in Amazon ECR
        env:
          IMAGE_TAG: ${{ steps.build-image.outputs.image-tag }}
        run: |
          echo "Starting vulnerability scan for ${ECR_REPOSITORY}:${IMAGE_TAG}"

          aws ecr start-image-scan \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}"

          aws ecr wait image-scan-complete \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}"

          FINDINGS=$(aws ecr describe-image-scan-findings \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}" \
            --output json)

          echo "Vulnerability summary:"
          echo "${FINDINGS}" |
            jq '.imageScanFindings.findingSeverityCounts // {}'

          CRITICAL=$(echo "${FINDINGS}" |
            jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0')

          HIGH=$(echo "${FINDINGS}" |
            jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0')

          {
            echo "## ECR vulnerability scan"
            echo ""
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Critical findings: **${CRITICAL}**"
            echo "- High findings: **${HIGH}**"
            echo "- Enforcement: **informational**"
            echo "- Note: the application image and Dockerfile were supplied as part of the assessment."
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${CRITICAL}" -gt 0 ]; then
            echo "::warning::The evaluator-provided image contains ${CRITICAL} critical findings."
            echo "Findings are reported for visibility but do not block deployment."
          else
            echo "Image scan completed: no critical findings detected."
          fi

          mkdir -p reports

          # Conservar también la respuesta original de AWS
          printf '%s\n' "${FINDINGS}" \
            > reports/ecr-scan-findings.json

          {
            echo ""
            echo "### Critical and high vulnerabilities"
            echo ""
            echo "| Severity | CVE |"
            echo "|---|---|"

            printf '%s\n' "${FINDINGS}" | jq -r '
              [
                .imageScanFindings.findings[]?
                | select(
                    .severity == "CRITICAL" or
                    .severity == "HIGH"
                  )
              ][0:10][]
              | "| \(.severity) | `\(.name)` |"
            '

            echo ""
            echo "The complete CSV and JSON reports are available in the workflow artifacts."
          } >> "${GITHUB_STEP_SUMMARY}"

          # Convertir los hallazgos de ECR a CSV
          printf '%s\n' "${FINDINGS}" | jq -r '
            [
              "CVE",
              "Severity",
              "URI",
              "Description",
              "Attributes"
            ],
            (
              .imageScanFindings.findings[]? |
              [
                (.name // ""),
                (.severity // "UNDEFINED"),
                (.uri // ""),
                (
                  (.description // "")
                  | gsub("[\r\n]+"; " ")
                ),
                (
                  (.attributes // [])
                  | map("\(.key)=\(.value // "")")
                  | join("; ")
                )
              ]
            )
            | @csv
          ' > reports/ecr-vulnerabilities.csv

          echo "CSV rows generated:"
          wc -l reports/ecr-vulnerabilities.csv

      - name: Upload ECR vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: ecr-vulnerabilities-${{ steps.build-image.outputs.image-tag }}
          path: |
            reports/ecr-vulnerabilities.csv
            reports/ecr-scan-findings.json
          if-no-files-found: error
          retention-days: 7

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_FILE }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Capture current task definition
        id: previous_task
        run: |
          PREVIOUS_TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" \
            --query "services[0].taskDefinition" \
            --output text)

          if [ -z "${PREVIOUS_TASK_DEFINITION_ARN}" ] || \
             [ "${PREVIOUS_TASK_DEFINITION_ARN}" = "None" ]; then
            echo "::error::Could not determine the current task definition."
            exit 1
          fi

          echo "Current task definition: ${PREVIOUS_TASK_DEFINITION_ARN}"
          echo "task_definition_arn=${PREVIOUS_TASK_DEFINITION_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Register tagged task definition
        id: register-task-definition
        env:
          RENDERED_TASK_DEFINITION: ${{ steps.render-task-definition.outputs.task-definition }}
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${RENDERED_TASK_DEFINITION}" \
            --tags \
              key=ethos:candidate,value="${CANDIDATE_ID}" \
              key=ethos:project,value="${PROJECT_TAG}" \
            --region "${AWS_REGION}" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "Registered ${TASK_DEFINITION_ARN}"
          echo "task-definition-arn=${TASK_DEFINITION_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Deploy task definition to ECS
        id: deploy_service
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-task-definition.outputs.task-definition-arn }}
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --desired-count 1 \
            --force-new-deployment \
            --health-check-grace-period-seconds 30 \
            --enable-ecs-managed-tags \
            --propagate-tags SERVICE \
            --region "${AWS_REGION}"

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}"

      - name: Validate public endpoints
        run: |
          HEALTH_RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 10 \
            "${ALB_URL}/health")

          READY_RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 10 \
            "${ALB_URL}/ready")

          echo "/health: ${HEALTH_RESPONSE}"
          echo "/ready: ${READY_RESPONSE}"

          echo "${HEALTH_RESPONSE}" | jq -e '
            .status == "ok" and
            .service == "ethos-mock"
          '

          echo "${READY_RESPONSE}" | jq -e '
            .ready == true
          '

      - name: Roll back failed deployment
        if: >-
          ${{
            failure() &&
            steps.deploy_service.outputs.started == 'true' &&
            steps.previous_task.outputs.task_definition_arn != ''
          }}
        env:
          PREVIOUS_TASK_DEFINITION_ARN: ${{ steps.previous_task.outputs.task_definition_arn }}
        run: |
          echo "::warning::Deployment failed. Rolling back to ${PREVIOUS_TASK_DEFINITION_ARN}"

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${PREVIOUS_TASK_DEFINITION_ARN}" \
            --desired-count 1 \
            --region "${AWS_REGION}"

           echo "started=true" >> "${GITHUB_OUTPUT}"

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}"

          {
            echo "## ECS deployment rolled back"
            echo ""
            echo "The new deployment failed its stability or endpoint validation."
            echo ""
            echo "- Restored task definition: \`${PREVIOUS_TASK_DEFINITION_ARN}\`"
            echo "- Cluster: \`${ECS_CLUSTER}\`"
            echo "- Service: \`${ECS_SERVICE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Deployment summary
        run: |
          {
            echo "## ECS deployment completed"
            echo ""
            echo "- Image: \`${{ steps.build-image.outputs.image }}\`"
            echo "- Task definition: \`${{ steps.register-task-definition.outputs.task-definition-arn }}\`"
            echo "- Cluster: \`${ECS_CLUSTER}\`"
            echo "- Service: \`${ECS_SERVICE}\`"
            echo "- Health: \`${ALB_URL}/health\`"
            echo "- Ready: \`${ALB_URL}/ready\`"
          } >> "${GITHUB_STEP_SUMMARY}"
