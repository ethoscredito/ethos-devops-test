services:
  ethos-mock:
    build:
      context: .
      dockerfile: Dockerfile
    image: ethos-mock:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
