apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ethos-mock
  namespace: ethos-cand-lucio-o-dev
  annotations:
    # Requiere AWS Load Balancer Controller instalado en el cluster.
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/load-balancer-name: ethos-cand-lucio-o-dev-k8s-alb
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    # Los tags son obligatorios: sin ellos el controller no puede crear el ALB.
    alb.ingress.kubernetes.io/tags: ethos:candidate=lucio-o-dev,ethos:project=devops-test
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-ethos-mock
                port:
                  name: http
